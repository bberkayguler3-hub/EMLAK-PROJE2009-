requirements.txtemlak_asistani.py import streamlit as st

# Sayfa yapılandırması
st.set_page_config(page_title="Emlak AI Asistanı", layout="wide")

st.title("🏠 Emlak AI - Profesyonel İlan Oluşturucu")
st.write("Evin özelliklerini girin, AI sizin için profesyonel ilan metnini hazırlasın.")

# Sol taraf: Giriş Alanları
with st.sidebar:
    st.header("Konut Bilgileri")
    mevki = st.text_input("Konum / Semt", placeholder="Örn: Beşiktaş, İstanbul")
    oda_sayisi = st.selectbox("Oda Sayısı", ["1+0", "1+1", "2+1", "3+1", "4+1", "Villa"])
    metrekare = st.number_input("Metrekare (m²)", min_value=10, max_value=2000, value=100)
    bina_yasi = st.slider("Bina Yaşı", 0, 50, 5)
    fiyat = st.text_input("Fiyat (TL)", placeholder="Örn: 5.500.000")

# Orta kısım: Özellikler ve Sonuç
st.subheader("Öne Çıkan Özellikler")
ekstra = st.text_area("Ekstra Özellikler", placeholder="Deniz manzaralı, yeni boyalı, ebeveyn banyolu, metroya yakın...")

if st.button("✨ İlan Metni Oluştur"):
    if mevki and fiyat:
        st.success("İlan Taslağı Başarıyla Hazırlandı!")
        st.info(f"""
        ### TASLAK İLAN METNİ:
        **{mevki.upper()} BÖLGESİNDE KAÇIRILMAYACAK {oda_sayisi} FIRSAT DAİRE!**
        
        {mevki} bölgesinin en nezih lokasyonunda yer alan, {metrekare} m² genişliğindeki bu portföyümüz; 
        {bina_yasi} yaşında olup modern mimarisiyle dikkat çekmektedir.
        
        **Öne Çıkan Özellikler:**
        * {ekstra}
        
        **Fiyat:** {fiyat} TL
        
        Detaylı bilgi ve randevu için lütfen iletişime geçiniz.
        """)
    else:
        st.warning("Lütfen en azından Konum ve Fiyat bilgilerini doldurun.") 